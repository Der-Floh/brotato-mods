name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attach-mods:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Pack mods
        shell: pwsh
        run: ./.vscode/build/build.ps1

      - name: Validate packed mods
        shell: pwsh
        run: ./.vscode/build/validate.ps1

      - name: Attest the zips
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*/*.zip

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/*/*.zip --clobber
