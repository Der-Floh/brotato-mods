name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Der-Floh/Der-Floh/.github/workflows/mod-ci.yml@v1
    with:
      build-command: pwsh -NoProfile -File .vscode/build/build.ps1 -AllowEmpty && pwsh -NoProfile -File .vscode/build/validate.ps1
      extra-files: out/workshop/*.txt
      allow-empty: true
